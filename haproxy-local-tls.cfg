global
  log stdout format raw local0
  maxconn 256

defaults
  log global
  mode tcp
  timeout connect 5s
  timeout client 60s
  timeout server 60s

frontend aarogya_http_and_https
  bind *:8000
  tcp-request inspect-delay 5s
  tcp-request content accept if { req_ssl_hello_type 1 }
  use_backend aarogya_https if { req_ssl_hello_type 1 }
  default_backend aarogya_http

backend aarogya_http
  server backend_http backend:8000 check

backend aarogya_https
  server backend_https backend:8443 check
